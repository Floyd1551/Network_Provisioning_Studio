[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-switch-configurator"
version = "1.0.0rc1"
description = "Network Provisioning Studio for switches, routers and firewalls"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "pyserial>=3.5,<4", "netmiko>=4.4,<5"]

[project.gui-scripts]
switch-configurator = "switch_configurator.app:main"

[tool.setuptools.packages.find]
where = ["src"]
